<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">pi-mob — control local OMP sessions from your phone</title>
  <desc id="desc">An Android phone connected through private Tailscale Serve to a host running local OMP sessions.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.48" stop-color="#12103a"/>
      <stop offset="1" stop-color="#071b2d"/>
    </linearGradient>
    <radialGradient id="nebula" cx="50%" cy="48%" r="58%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".32"/>
      <stop offset=".45" stop-color="#06b6d4" stop-opacity=".13"/>
      <stop offset="1" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset=".52" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15173a"/>
      <stop offset="1" stop-color="#090b20"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#67e8f9" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1440" height="560" rx="28" fill="url(#space)"/>
  <rect width="1440" height="560" rx="28" fill="url(#nebula)"/>
  <rect width="1440" height="560" rx="28" fill="url(#grid)"/>
  <ellipse cx="730" cy="268" rx="430" ry="210" fill="#7c3aed" opacity=".13" filter="url(#soft)"/>
  <ellipse cx="1115" cy="290" rx="190" ry="150" fill="#0891b2" opacity=".13" filter="url(#soft)"/>

  <g fill="#fff">
    <circle cx="86" cy="76" r="2" opacity=".8"/><circle cx="188" cy="149" r="1.5" opacity=".6"/>
    <circle cx="337" cy="68" r="1" opacity=".7"/><circle cx="516" cy="104" r="1.5" opacity=".45"/>
    <circle cx="690" cy="59" r="2" opacity=".5"/><circle cx="810" cy="111" r="1" opacity=".8"/>
    <circle cx="1002" cy="66" r="1.5" opacity=".6"/><circle cx="1290" cy="108" r="2" opacity=".7"/>
    <circle cx="1371" cy="212" r="1" opacity=".6"/><circle cx="118" cy="436" r="1.5" opacity=".55"/>
    <circle cx="415" cy="486" r="1" opacity=".65"/><circle cx="884" cy="475" r="1.5" opacity=".5"/>
    <circle cx="1317" cy="461" r="1" opacity=".7"/>
  </g>

  <!-- private network arc -->
  <path d="M475 347 C665 130 870 133 1033 267" fill="none" stroke="#67e8f9" stroke-opacity=".18" stroke-width="18" filter="url(#glow)"/>
  <path d="M475 347 C665 130 870 133 1033 267" fill="none" stroke="url(#neon)" stroke-width="3" stroke-dasharray="9 13"/>
  <g fill="#e0f2fe" filter="url(#glow)">
    <circle cx="588" cy="244" r="5"/><circle cx="744" cy="181" r="5"/><circle cx="902" cy="205" r="5"/>
  </g>

  <!-- phone -->
  <g transform="translate(352 142) rotate(-7 112 174)">
    <rect x="0" y="0" width="224" height="356" rx="38" fill="#050713" stroke="url(#neon)" stroke-width="4" filter="url(#glow)"/>
    <rect x="13" y="15" width="198" height="326" rx="28" fill="url(#screen)" stroke="#64748b" stroke-opacity=".35"/>
    <rect x="79" y="8" width="66" height="12" rx="6" fill="#02030a"/>
    <circle cx="112" cy="322" r="5" fill="#67e8f9" opacity=".75"/>
    <g transform="translate(31 51)">
      <circle cx="15" cy="14" r="9" fill="#34d399" filter="url(#glow)"/>
      <text x="33" y="20" fill="#d1fae5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">CONNECTED</text>
      <rect y="47" width="162" height="61" rx="13" fill="#1e1b4b" stroke="#8b5cf6" stroke-opacity=".7"/>
      <text x="15" y="71" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">session / feature-ui</text>
      <text x="15" y="93" fill="#fff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">Building… ✦</text>
      <rect y="122" width="162" height="61" rx="13" fill="#082f49" stroke="#06b6d4" stroke-opacity=".7"/>
      <text x="15" y="147" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">tests</text>
      <text x="15" y="169" fill="#fff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">559 passed ✓</text>
      <rect y="201" width="162" height="42" rx="21" fill="url(#neon)"/>
      <text x="81" y="228" text-anchor="middle" fill="#090b20" font-family="system-ui, sans-serif" font-size="15" font-weight="800">STEER SESSION</text>
    </g>
  </g>

  <!-- host core -->
  <g transform="translate(1010 188)">
    <path d="M0 34L94 0l94 34v112l-94 34L0 146Z" fill="#090b20" stroke="url(#neon)" stroke-width="3" filter="url(#glow)"/>
    <path d="M0 34l94 35 94-35M94 69v111" fill="none" stroke="#67e8f9" stroke-opacity=".42"/>
    <circle cx="94" cy="91" r="43" fill="#11183d" stroke="#a78bfa" stroke-width="2"/>
    <text x="94" y="108" text-anchor="middle" fill="url(#neon)" font-family="Georgia, serif" font-size="68" font-weight="700">π</text>
    <g transform="translate(32 205)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      <rect width="125" height="34" rx="17" fill="#052e2b" stroke="#34d399" stroke-opacity=".7"/>
      <circle cx="19" cy="17" r="5" fill="#34d399" filter="url(#glow)"/>
      <text x="34" y="22" fill="#a7f3d0">HOST SECURE</text>
    </g>
  </g>

  <!-- brand -->
  <g transform="translate(655 267)">
    <text x="0" y="0" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="76" font-weight="900" letter-spacing="-4">pi-mob</text>
    <rect x="-152" y="18" width="304" height="5" rx="2.5" fill="url(#neon)" filter="url(#glow)"/>
    <text x="0" y="66" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="600" letter-spacing="2">YOUR SESSIONS. YOUR HOST. ANYWHERE.</text>
    <g transform="translate(-116 94)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      <rect width="232" height="36" rx="18" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="116" y="23" text-anchor="middle" fill="#a5f3fc">PRIVATE • DURABLE • MOBILE</text>
    </g>
  </g>

  <rect x="1.5" y="1.5" width="1437" height="557" rx="26.5" fill="none" stroke="url(#neon)" stroke-opacity=".48" stroke-width="3"/>
</svg>
