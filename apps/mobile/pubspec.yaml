publish_to: 'none'
version: 0.0.1-alpha.1+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.9
  unorm_dart: 0.3.2
  drift: 2.34.1
  drift_flutter: 0.3.1
