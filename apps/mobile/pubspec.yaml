name: pi_mob
description: "pi-mob Flutter mobile control surface (M1 scaffold)."
publish_to: 'none'
version: 0.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  # The shared protocol-fixtures corpus is the single source of truth for both
  # the Dart and TypeScript test suites. The relative path below keeps the
  # bytes identical without copying the file.
  assets:
    - ../../packages/protocol-fixtures/corpus/
