name: Preview Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing or new v* tag for the draft preview release"
        required: true
        type: string

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  FLUTTER_VERSION: 3.44.4

jobs:
  validate:
    name: Validate docs and release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate preview tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v.+$ ]]; then
            echo "::error::Preview releases require a v* tag (received: $RELEASE_TAG)"
            exit 1
          fi

      - name: Install Bun
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip" -o /tmp/bun.zip
          echo "951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f  /tmp/bun.zip" | sha256sum -c -
          unzip -q /tmp/bun.zip -d /tmp/bun-extract
          sudo mv "/tmp/bun-extract/bun-linux-x64/bun" /usr/local/bin/bun
          sudo chmod +x /usr/local/bin/bun
          bun --version

      - name: Check documentation links
        run: bun run docs:check

  android:
    name: Build Android preview APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve and validate Flutter app
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Validate Android preview identity and floor
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'minSdk = 29' apps/mobile/android/app/build.gradle.kts
          grep -q 'applicationId = "com.example.pi_mob"' apps/mobile/android/app/build.gradle.kts
          grep -q 'signingConfig = signingConfigs.getByName("debug")' apps/mobile/android/app/build.gradle.kts
          echo "Building a PRE-RELEASE APK with placeholder identity and development signing."

      - name: Build pre-release APK
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release
          if [[ ! -f android/app/google-services.json ]]; then
            echo "Push notifications are not configured in this preview APK; bridge control and pairing remain available."
          fi

      - name: Name and checksum APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          version="${RELEASE_TAG#v}"
          asset="pi-mob-android-preview-${version}.apk"
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk "release-assets/$asset"
          (cd release-assets && sha256sum "$asset" > "$asset.sha256")

      - name: Upload Android assets
        uses: actions/upload-artifact@v4
        with:
          name: android-preview-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  bridge:
    name: Build macOS x64 bridge bundle
    needs: validate
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-darwin-x64.zip" -o /tmp/bun.zip
          echo "4183df3374623e5bab315c547cfa0974533cd457d86b73b639f7a87974cd6633  /tmp/bun.zip" | shasum -a 256 -c -
          unzip -q /tmp/bun.zip -d /tmp/bun-extract
          sudo mv "/tmp/bun-extract/bun-darwin-x64/bun" /usr/local/bin/bun
          sudo chmod +x /usr/local/bin/bun
          bun --version
          bun --revision

      - name: Validate x64 release runner
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" != "x86_64" ]]; then
            echo "::error::The existing bridge release build is validated only on macOS x86_64."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build existing release bundle
        run: bun run build

      - name: Archive and checksum bridge bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          version="${RELEASE_TAG#v}"
          asset="pi-mob-bridge-${version}-macos-x64.tar.gz"
          tar -czf "release-assets/$asset" -C packages/bridge/dist release
          (cd release-assets && shasum -a 256 "$asset" > "$asset.sha256")

      - name: Upload bridge assets
        uses: actions/upload-artifact@v4
        with:
          name: bridge-preview-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create draft pre-release
    needs: [android, bridge]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: "*-preview-assets"
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -maxdepth 1 -type f -print -exec sha256sum {} \;

      - name: Create draft preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: pi-mob ${{ env.RELEASE_TAG }} preview (pre-release)
          draft: true
          prerelease: true
          generate_release_notes: true
          body: |
            ## PRE-RELEASE PREVIEW

            This release is for testing only.

            - The Android APK uses a placeholder application identity and development/debug signing. It is not production-signed.
            - The macOS x64 bridge bundle is not code-signed or notarized.
            - iOS is not distributed.
            - Verify each asset with its adjacent `.sha256` file before use.
          files: release-assets/*
          fail_on_unmatched_files: true
