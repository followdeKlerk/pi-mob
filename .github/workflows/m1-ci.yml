name: M2 CI

on:
  push:
    branches: [m1-m2-scaffold, main]
  pull_request:
    branches: [m1-m2-scaffold, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    name: Bridge + Bun + Docs + Security + Schema
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      BUN_VERSION: 1.3.14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-darwin-x64.zip" \
            -o /tmp/bun.zip
          echo "4183df3374623e5bab315c547cfa0974533cd457d86b73b639f7a87974cd6633  /tmp/bun.zip" | shasum -a 256 -c -
          unzip -q /tmp/bun.zip -d /tmp/bun-extract
          sudo mv /tmp/bun-extract/bun-darwin-x64/bun /usr/local/bin/bun
          sudo chmod +x /usr/local/bin/bun
          bun --version
          bun --revision

      - name: Install Flutter (3.44.4 stable)
        run: |
          set -euo pipefail
          curl -fsSL "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_3.44.4-stable.zip" \
            -o /tmp/flutter.zip
          echo "32bca4386121042e827ff2d90edbd7c7fb47c514fc04d5a87db6e3202dafde5d  /tmp/flutter.zip" | shasum -a 256 -c -
          sudo mkdir -p /opt
          sudo unzip -q /tmp/flutter.zip -d /opt
          sudo chown -R "$(id -u):$(id -g)" /opt/flutter
          echo "/opt/flutter/bin" >> "$GITHUB_PATH"
          /opt/flutter/bin/flutter --version

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd apps/mobile && /opt/flutter/bin/flutter pub get

      - name: Run M2 validation
        run: bun run all

  mobile:
    name: Mobile (Dart analyze + fixture parity)
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      BUN_VERSION: 1.3.14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-darwin-x64.zip" \
            -o /tmp/bun.zip
          echo "4183df3374623e5bab315c547cfa0974533cd457d86b73b639f7a87974cd6633  /tmp/bun.zip" | shasum -a 256 -c -
          unzip -q /tmp/bun.zip -d /tmp/bun-extract
          sudo mv /tmp/bun-extract/bun-darwin-x64/bun /usr/local/bin/bun

      - name: Install Flutter (3.44.4 stable)
        run: |
          set -euo pipefail
          curl -fsSL "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_3.44.4-stable.zip" \
            -o /tmp/flutter.zip
          echo "32bca4386121042e827ff2d90edbd7c7fb47c514fc04d5a87db6e3202dafde5d  /tmp/flutter.zip" | shasum -a 256 -c -
          sudo mkdir -p /opt
          sudo unzip -q /tmp/flutter.zip -d /opt
          sudo chown -R "$(id -u):$(id -g)" /opt/flutter
          echo "/opt/flutter/bin" >> "$GITHUB_PATH"
          /opt/flutter/bin/flutter --version

      - name: Validate mobile deployment floors
        run: |
          set -euo pipefail
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 16.1' apps/mobile/ios/Runner.xcodeproj/project.pbxproj
          grep -q 'minSdk = 29' apps/mobile/android/app/build.gradle.kts

      - name: pub get
        working-directory: apps/mobile
        run: flutter pub get

      - name: flutter analyze
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos

      - name: flutter test (protocol fixture parity)
        working-directory: apps/mobile
        run: flutter test test/protocol_fixture_test.dart
